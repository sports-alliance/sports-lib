name: Publish npm package

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - package.json
      - package-lock.json

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  detect-release:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      create_tag: ${{ steps.release.outputs.create_tag }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: release
        name: Detect a publishable version
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          version="$(node -p "require('./package.json').version")"
          node <<'NODE'
          const packageJson = require('./package.json');
          const lockfile = require('./package-lock.json');

          if (
            packageJson.version !== lockfile.version ||
            packageJson.version !== lockfile.packages[''].version
          ) {
            throw new Error('package.json and package-lock.json must have the same version');
          }
          NODE

          echo "version=$version" >> "$GITHUB_OUTPUT"

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "Tag $GITHUB_REF_NAME does not match package version $version" >&2
              exit 1
            fi

            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "create_tag=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "Unable to compare this push with its previous package version" >&2
            exit 1
          fi

          previous_version="$(git show "$BEFORE:package.json" | node -e "let input=''; process.stdin.on('data', (chunk) => input += chunk); process.stdin.on('end', () => process.stdout.write(JSON.parse(input).version));")"

          if [ "$previous_version" = "$version" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "create_tag=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "create_tag=true" >> "$GITHUB_OUTPUT"

  publish:
    needs: detect-release
    if: needs.detect-release.outputs.publish == 'true' && vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: npm

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: npm ci
      - run: npm test
      - run: npm run docs:build

      - name: Verify the publishable package
        run: |
          npm pack --dry-run --json > "$RUNNER_TEMP/npm-pack.json"
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const [pack] = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/npm-pack.json', 'utf8'));
          const unexpected = pack.files
            .map(({ path }) => path)
            .filter((path) => !['LICENSE', 'README.md', 'package.json'].includes(path) && !path.startsWith('lib/'));
          const tests = pack.files
            .map(({ path }) => path)
            .filter((path) => /\.spec\.(?:js|d\.ts)$/.test(path));

          if (unexpected.length > 0 || tests.length > 0) {
            throw new Error(`Unexpected package files: ${[...unexpected, ...tests].join(', ')}`);
          }

          console.log(`Validated ${pack.entryCount} files (${pack.unpackedSize} bytes unpacked).`);
          NODE

      - id: publish
        name: Publish to npm
        env:
          VERSION: ${{ needs.detect-release.outputs.version }}
        run: |
          package_name="$(node -p "require('./package.json').name")"

          if npm view "$package_name@$VERSION" version > /dev/null 2>&1; then
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then
              echo "Version $VERSION is already published; nothing to do."
              echo "published=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Version $VERSION is already published." >&2
            exit 1
          fi

          npm publish
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Tag the published release
        if: needs.detect-release.outputs.create_tag == 'true' && steps.publish.outputs.published == 'true'
        env:
          VERSION: ${{ needs.detect-release.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"
