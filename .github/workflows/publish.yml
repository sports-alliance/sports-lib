name: Publish npm package

# A workflow_run is deliberately used instead of a second push trigger: publishing
# begins only after Test has succeeded for the exact commit that landed on main.
on:
  workflow_run:
    workflows: [Test]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  detect-release:
    # Test also runs for pull requests, but only successful push runs may release.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - uses: actions/checkout@v6
        with:
          # Do not publish whatever happens to be at main when this starts.
          # Publish the precise commit whose Test run completed successfully.
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - id: release
        name: Detect a publishable version
        run: |
          version="$(node -p "require('./package.json').version")"
          node <<'NODE'
          const packageJson = require('./package.json');
          const lockfile = require('./package-lock.json');

          if (
            packageJson.version !== lockfile.version ||
            packageJson.version !== lockfile.packages[''].version
          ) {
            throw new Error('package.json and package-lock.json must have the same version');
          }
          NODE

          echo "version=$version" >> "$GITHUB_OUTPUT"

          # A version bump may be followed by code fixes in the same push, so the
          # immediate parent of TARGET_SHA is not a reliable release baseline.
          # The release tag is created only after a successful npm publish and is
          # therefore the durable marker that this version is already released.
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "publish=true" >> "$GITHUB_OUTPUT"

  publish:
    needs: detect-release
    if: needs.detect-release.outputs.publish == 'true' && vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: npm ci

      - name: Verify the publishable package
        run: |
          npm pack --dry-run --json > "$RUNNER_TEMP/npm-pack.json"
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const [pack] = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/npm-pack.json', 'utf8'));
          const unexpected = pack.files
            .map(({ path }) => path)
            .filter((path) => !['LICENSE', 'README.md', 'package.json'].includes(path) && !path.startsWith('lib/'));
          const tests = pack.files
            .map(({ path }) => path)
            .filter((path) => /\.spec\.(?:js|d\.ts)$/.test(path));

          if (unexpected.length > 0 || tests.length > 0) {
            throw new Error(`Unexpected package files: ${[...unexpected, ...tests].join(', ')}`);
          }

          console.log(`Validated ${pack.entryCount} files (${pack.unpackedSize} bytes unpacked).`);
          NODE

      - name: Publish to npm
        env:
          VERSION: ${{ needs.detect-release.outputs.version }}
        run: |
          package_name="$(node -p "require('./package.json').name")"

          if npm view "$package_name@$VERSION" version > /dev/null 2>&1; then
            echo "Version $VERSION is already published." >&2
            exit 1
          fi

          npm publish

      - name: Tag the published release
        env:
          VERSION: ${{ needs.detect-release.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"
